<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
	<title>Power BI</title>
	<!-- https://www.jsdelivr.com/package/npm/@azure/msal-browser -->
	<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.21.0/lib/msal-browser.min.js" integrity="sha256-Eo+/f2kF2oiQmldPg2lTNeCQxXdapmk1zSvhAQbzoVI=" crossorigin="anonymous"></script>
	<!-- https://www.jsdelivr.com/package/npm/powerbi-client -->
	<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.24.1/dist/powerbi.min.js" integrity="sha256-WNgFGJhWT8Lt09f0Ike2d8Cg/V/Hevo5XRl3f2GnsrY=" crossorigin="anonymous"></script>
	<style>
		* {
			box-sizing: border-box;
		}

		html, body, iframe {
			margin: 0;
			padding: 0;
			border: 0;
			height: 100vh;
			width: 100%;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			font-family: system-ui, sans-serif;
			color: #333333;
		}

		button {
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
			gap: 5px;
			padding: 0.75em;
			font-weight: 600;
			color: #ffffff;
			background-color: #117865;
			border: 0;
			border-radius: 5px;
			cursor: pointer;

			&:hover, &:focus {
				background-color: #0c695a;
			}

			&:active {
				background-color: #0c5c50;
			}

			&:disabled {
				cursor: default;
				opacity: 0.6;
			}

			> svg {
				height: 1em;
				width: 1em;
				vertical-align: -0.125em;
				fill: currentColor;
			}
		}

		.error-page {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1em;
			padding: 2em;
			max-width: 40em;
			text-align: center;

			> h1 {
				margin: 0;
				font-size: 1.25em;
			}

			> p {
				margin: 0;
				color: #666666;
			}
		}
	</style>
</head>

<body>
	<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
		<symbol id="fa-microsoft" viewBox="0 0 448 512"><!-- Font Awesome by @fontawesome - https://fontawesome.com -->
			<path d="M0 32h214.6v214.6H0V32zm233.4 0H448v214.6H233.4V32zM0 265.4h214.6V480H0V265.4zm233.4 0H448V480H233.4V265.4z" />
		</symbol>
	</svg>
	<script th:inline="javascript">
		(async () => {
			'use strict';

			const clientId = /*[[${clientId}]]*/'';
			const tenantId = /*[[${tenantId}]]*/'';
			const workspaceId = /*[[${workspaceId}]]*/'';
			const reportId = /*[[${reportId}]]*/'';
			const reportPageName = /*[[${reportPageName}]]*/'';
			const dashboardId = /*[[${dashboardId}]]*/'';
			const loadTimeoutMs = /*[[${loadTimeoutMs}]]*/60000;

			const withTimeout = (promise, ms, message) => {
				let timer;
				const timeout = new Promise((_, reject) => {
					timer = setTimeout(() => reject(new Error(message)), ms);
				});
				return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
			};

			const showError = (message) => {
				document.title = 'Error';
				const container = document.createElement('div');
				container.className = 'error-page';
				const heading = document.createElement('h1');
				heading.textContent = 'Unable to load content';
				const detail = document.createElement('p');
				detail.textContent = message;
				const retry = document.createElement('button');
				retry.type = 'button';
				retry.textContent = 'Retry';
				retry.addEventListener('click', () => window.location.reload());
				container.append(heading, detail, retry);
				document.body.replaceChildren(container);
			};

			try {
				const powerbiLib = window['powerbi-client'];
				if (!powerbiLib) {
					throw new Error('powerbi-client SDK failed to load');
				}

				const { service, factories, models } = powerbiLib;
				const powerbi = new service.Service(
					factories.hpmFactory,
					factories.wpmpFactory,
					factories.routerFactory,
				);

				const calculateReportLayout = async (report) => {
					const { width, height } = window.screen;
					let layout = models.LayoutType.Master;
					if (Math.min(width, height) < 768) {
						const mobileLayout = width > height
							? models.LayoutType.MobileLandscape
							: models.LayoutType.MobilePortrait;
						const page = await report.getActivePage();
						if (await page.hasLayout(mobileLayout)) {
							layout = mobileLayout;
						}
					}
					return layout;
				};

				const changeReportLayout = async (report, layout) => {
					report.config.settings.layoutType = layout;
					const bookmark = await report.bookmarksManager.capture();
					report = await loadReport(report.element, report.config);
					report.bookmarksManager.applyState(bookmark.state);
					return report;
				};

				const loadReport = (element, config) => new Promise((resolve, reject) => {
					try {
						powerbi.reset(element);
						const report = powerbi.load(element, config);
						report.on('loaded', () => resolve(report));
						report.on('error', (event) => reject(new Error(event.detail?.message || 'Failed to load report')));
					} catch (error) {
						reject(error);
					}
				});

				const renderReport = (element, config) => new Promise((resolve, reject) => {
					(async () => {
						try {
							let report = await loadReport(element, config);
							const currentLayout = report.config.settings.layoutType;
							const calculatedLayout = await calculateReportLayout(report);
							if (currentLayout !== calculatedLayout) {
								report = await changeReportLayout(report, calculatedLayout);
							}
							report.on('rendered', () => resolve(report));
							report.on('error', (event) => reject(new Error(event.detail?.message || 'Failed to render report')));
							report.render();
						} catch (error) {
							reject(error);
						}
					})();
				});

				const renderDashboard = (element, config) => new Promise((resolve, reject) => {
					try {
						powerbi.reset(element);
						const dashboard = powerbi.embed(element, config);
						dashboard.on('tileClicked', ({ detail }) => {
							const navigationData = detail.navigationUrl?.match(/\/reports\/([0-9A-Fa-f-]+)\/(ReportSection[0-9A-Fa-f]+)/);
							if (navigationData) {
								const [, reportId, reportPageName] = navigationData;
								window.location.search = new URLSearchParams({ workspaceId, reportId, reportPageName }).toString();
							}
						});
						dashboard.on('loaded', () => resolve(dashboard));
						dashboard.on('error', (event) => reject(new Error(event.detail?.message || 'Failed to load dashboard')));
					} catch (error) {
						reject(error);
					}
				});

				const msalLib = window['msal'];
				if (!msalLib) {
					throw new Error('msal-browser SDK failed to load');
				}

				const { PublicClientApplication } = msalLib;
				const msal = new PublicClientApplication({
					system: {
						navigatePopups: false,
					},
					auth: {
						clientId,
						authority: `https://login.microsoftonline.com/${tenantId}`,
						redirectUri: `${window.location.origin}${window.location.pathname}`,
					},
				});
				await msal.initialize();

				const apiBase = 'https://api.powerbi.com/v1.0/myorg';
				const scopes = [
					'https://analysis.windows.net/powerbi/api/Report.Read.All',
					'https://analysis.windows.net/powerbi/api/Dashboard.Read.All',
				];

				const getAccessToken = async () => {
					const accounts = msal.getAllAccounts();
					if (accounts.length > 0) {
						try {
							const { accessToken } = await msal.acquireTokenSilent({ scopes, account: accounts[0] });
							return accessToken;
						} catch (error) {
							// Silent acquisition failed, fall back to an interactive flow below.
						}
					}
					return await new Promise((resolve) => {
						const button = document.createElement('button');
						const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
						const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
						use.setAttribute('href', '#fa-microsoft');
						icon.append(use);
						const text = document.createElement('span');
						text.textContent = 'Sign in with Microsoft';
						button.append(icon, text);
						button.onclick = async () => {
							try {
								const { accessToken } = await msal.acquireTokenPopup({ scopes, overrideInteractionInProgress: true });
								button.remove();
								resolve(accessToken);
							} catch (error) {
								console.error(error);
							}
						};
						document.body.appendChild(button);
					});
				};

				const getResourceData = async (url, fallbackUrl, fallbackData, accessToken) => {
					try {
						let resp = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
						if (resp.status < 200 || resp.status > 299) {
							resp = await fetch(fallbackUrl, { headers: { Authorization: `Bearer ${accessToken}` } });
							if (resp.status < 200 || resp.status > 299) {
								throw new Error(`Error loading resource:\n${resp.status} ${resp.statusText}`);
							}
						}
						return await resp.json();
					} catch (error) {
						console.error(error);
						return fallbackData;
					}
				};

				const accessToken = await getAccessToken();
				if (!accessToken) {
					throw new Error('Could not acquire an access token');
				}
				const tokenType = models.TokenType.Aad;
				const eventHooks = { accessTokenProvider: getAccessToken };

				let resourceData;
				let embedType;
				if (reportId) {
					embedType = 'report';
					const fallbackEmbedUrl = new URL('https://app.powerbi.com/reportEmbed');
					fallbackEmbedUrl.searchParams.set('reportId', reportId);
					fallbackEmbedUrl.searchParams.set('groupId', workspaceId);
					resourceData = await getResourceData(
						`${apiBase}/groups/${workspaceId}/reports/${reportId}`,
						`${apiBase}/reports/${reportId}`,
						{ id: reportId, embedUrl: fallbackEmbedUrl.toString(), name: 'Power BI Report' },
						accessToken,
					);
				} else if (dashboardId) {
					embedType = 'dashboard';
					const fallbackEmbedUrl = new URL('https://app.powerbi.com/dashboardEmbed');
					fallbackEmbedUrl.searchParams.set('dashboardId', dashboardId);
					fallbackEmbedUrl.searchParams.set('groupId', workspaceId);
					resourceData = await getResourceData(
						`${apiBase}/groups/${workspaceId}/dashboards/${dashboardId}`,
						`${apiBase}/dashboards/${dashboardId}`,
						{ id: dashboardId, embedUrl: fallbackEmbedUrl.toString(), displayName: 'Power BI Dashboard' },
						accessToken,
					);
				} else {
					throw new Error('Unknown embed type');
				}

				switch (embedType) {
					case 'report':
						document.title = `${resourceData.name} - Report`;
						await withTimeout(
							renderReport(document.body, {
								type: 'report',
								id: resourceData.id,
								embedUrl: resourceData.embedUrl,
								permissions: models.Permissions.Read,
								viewMode: models.ViewMode.View,
								pageName: reportPageName || undefined,
								settings: { layoutType: models.LayoutType.Master },
								accessToken,
								tokenType,
								eventHooks,
							}),
							loadTimeoutMs,
							`The report took too long to load (over ${loadTimeoutMs / 1000} seconds). Please try again later.`,
						);
						break;
					case 'dashboard':
						document.title = `${resourceData.displayName} - Dashboard`;
						await withTimeout(
							renderDashboard(document.body, {
								type: 'dashboard',
								id: resourceData.id,
								embedUrl: resourceData.embedUrl,
								permissions: models.Permissions.Read,
								viewMode: models.ViewMode.View,
								pageView: 'fitToWidth',
								accessToken,
								tokenType,
								eventHooks,
							}),
							loadTimeoutMs,
							`The dashboard took too long to load (over ${loadTimeoutMs / 1000} seconds). Please try again later.`,
						);
						break;
					default:
						throw new Error('Unknown embed type');
				}
			} catch (error) {
				console.error(error);
				showError(error.message);
			}
		})();
	</script>
</body>

</html>
